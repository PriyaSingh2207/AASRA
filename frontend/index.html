<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>AASRA & Vitaforge - Mobile Wellness & Cognitive Care</title>

  <!-- Typography: Helvetica Now Var & System Fallbacks -->
  <link rel="stylesheet" href="https://db.onlinewebfonts.com/c/e66905e07608167a84e6ad52f638c3c6?family=Helvetica+Now+Var">
  <link rel="stylesheet" href="css/main.css">

  <!-- Tailwind CSS 3 CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Helvetica Now Var"', '"Helvetica Neue"', 'Helvetica', 'Arial', 'sans-serif'],
          },
          colors: {
            brand: {
              gold: '#dcc850',
              muted: '#8a9aaa',
              dark: '#1a1a1e'
            }
          }
        }
      }
    };
  </script>

  <!-- React 18 & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone for JSX Compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-2 sm:p-6 select-none">

  <!-- Root React Mount Container -->
  <div id="root"></div>

  <!-- Main Application Script with React 18 & Full Features -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- Lucide Icons as Crisp Inline SVGs ---
    const TimerIcon = ({ className = "w-3 h-3 text-white/80" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <line x1="10" x2="14" y1="2" y2="2"/>
        <line x1="12" x2="15" y1="14" y2="11"/>
        <circle cx="12" cy="14" r="8"/>
      </svg>
    );

    const ArrowRightIcon = ({ className = "w-4 h-4 text-gray-800" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
        <path d="M5 12h14"/>
        <path d="m12 5 7 7-7 7"/>
      </svg>
    );

    const ChevronRightIcon = ({ className = "w-3.5 h-3.5" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
        <path d="m9 18 6-6-6-6"/>
      </svg>
    );

    const MicIcon = ({ className = "w-5 h-5 text-white" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
        <line x1="12" x2="12" y1="19" y2="22"/>
      </svg>
    );

    const XIcon = ({ className = "w-5 h-5 text-white" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
      </svg>
    );

    const BrainIcon = ({ className = "w-5 h-5" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"/>
        <path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z"/>
        <path d="M15 13a4.5 4.5 0 0 1-3-4 4.5 4.5 0 0 1-3 4"/>
      </svg>
    );

    const PillIcon = ({ className = "w-5 h-5" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"/>
        <path d="m8.5 8.5 7 7"/>
      </svg>
    );

    const ShieldIcon = ({ className = "w-5 h-5" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>
      </svg>
    );

    const AlertTriangleIcon = ({ className = "w-5 h-5" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/>
        <line x1="12" x2="12" y1="9" y2="13"/>
        <line x1="12" x2="12.01" y1="17" y2="17"/>
      </svg>
    );

    const UserIcon = ({ className = "w-5 h-5" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
    );

    const SparklesIcon = ({ className = "w-5 h-5" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>
      </svg>
    );

    // --- Main Application Component ---
    function App() {
      // Wellness selection state (IDs 2 and 4 pre-selected as per prompt)
      const [selectedCards, setSelectedCards] = useState([2, 4]);
      
      // Dynamic Island expanded state
      const [islandExpanded, setIslandExpanded] = useState(false);

      // Active screen / overlay
      const [activeModal, setActiveModal] = useState(null); // 'plan', 'games', 'game_view', 'voice', 'caregiver', 'auth', 'emergency'
      const [selectedGame, setSelectedGame] = useState(null);

      // Slider state
      const [sliderProgress, setSliderProgress] = useState(0);
      const [isDragging, setIsDragging] = useState(false);
      const sliderTrackRef = useRef(null);

      // Voice assistant state
      const [isListening, setIsListening] = useState(false);
      const [voiceText, setVoiceText] = useState("");
      const [aiResponse, setAiResponse] = useState("");
      const [selectedLanguage, setSelectedLanguage] = useState("hi");

      // Multi-Role Auth State
      const [currentUser, setCurrentUser] = useState({
        name: "Savitri Devi",
        role: "patient",
        digital_id: "AASRA-8921-IND",
        pin: "8492"
      });

      // Cognitive Game Difficulty State from Groq LPU
      const [gameDifficulty, setGameDifficulty] = useState({
        level: 2.0,
        distractors: 4,
        clueDelay: 15,
        engine: "groq_lpu_ai",
        score: 85
      });

      const wellnessOptions = [
        { id: 1, number: "01", label: "Sleep quality", delay: "0.4s", icon: "🌙", desc: "Soothing audio routines & night wind-down" },
        { id: 2, number: "02", label: "Stress", delay: "0.48s", icon: "🌿", desc: "Gentle breathing & soothing nature sounds" },
        { id: 3, number: "03", label: "Weight", delay: "0.56s", icon: "🍎", desc: "Hydration alerts & gentle garden walks" },
        { id: 4, number: "04", label: "Skin", delay: "0.64s", icon: "✨", desc: "Ayurvedic wellness & hydration tracking" }
      ];

      // 8 Cognitive Games List
      const cognitiveGames = [
        { id: "photo_recall", title: "Family Photo Recall", domain: "Recognition & Episodic Memory", icon: "🖼️", desc: "Identify family members & cherished memories" },
        { id: "spatial_focus", title: "Gentle Target Focus", domain: "Attention & Spatial Tracking", icon: "🎯", desc: "Tap glowing tea cups & serene garden leaves" },
        { id: "time_quiz", title: "Clock & Season Check", domain: "Temporal & Environmental Orientation", icon: "🕒", desc: "Simple time, month, and weather check" },
        { id: "math_puzzle", title: "Coin & Tea Numbers", domain: "Gentle Mental Arithmetic", icon: "🪙", desc: "Familiar market coins & tea cup sums" },
        { id: "plant_match", title: "Herbal Garden Match", domain: "Semantic Memory", icon: "🌿", desc: "Tulsi, Neem, Rose & Chamomile pairing" },
        { id: "word_association", title: "Familiar Phrase Match", domain: "Language Fluency", icon: "🗣️", desc: "Complete timeless proverbs and phrases" },
        { id: "sequence_recall", title: "Nature Chime Sequence", domain: "Working Memory", icon: "🔔", desc: "Listen & repeat soothing temple bells" },
        { id: "daily_categorization", title: "Morning Tea Sorter", domain: "Executive Function", icon: "🫖", desc: "Sort morning routine items into trays" }
      ];

      // Card Toggle Handler
      const toggleCard = (id) => {
        setSelectedCards(prev => 
          prev.includes(id) ? prev.filter(item => item !== id) : [...prev, id]
        );
      };

      // Pointer Drag Handlers for Slider
      const handlePointerDown = (e) => {
        setIsDragging(true);
        e.currentTarget.setPointerCapture(e.pointerId);
      };

      const handlePointerMove = (e) => {
        if (!isDragging || !sliderTrackRef.current) return;
        const rect = sliderTrackRef.current.getBoundingClientRect();
        const maxDrag = rect.width - 48; // thumb width approx 44px + margins
        const offsetX = Math.max(0, Math.min(e.clientX - rect.left - 22, maxDrag));
        const progress = Math.min(100, Math.max(0, (offsetX / maxDrag) * 100));
        setSliderProgress(progress);
      };

      const handlePointerUp = () => {
        if (!isDragging) return;
        setIsDragging(false);
        if (sliderProgress >= 85) {
          setSliderProgress(100);
          setTimeout(() => {
            setActiveModal("plan");
            setSliderProgress(0);
          }, 300);
        } else {
          setSliderProgress(0);
        }
      };

      // Handle Voice Trigger
      const startVoiceSession = () => {
        setIsListening(true);
        setVoiceText("Listening in Hindi/English...");
        setAiResponse("");
        
        // Use Web Speech API or Sarvam AI fallback
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
          try {
            const recognition = new SpeechRecognition();
            recognition.lang = selectedLanguage === 'hi' ? 'hi-IN' : 'en-IN';
            recognition.onresult = (event) => {
              const text = event.results[0][0].transcript;
              setVoiceText(text);
              setIsListening(false);
              processVoiceCommand(text);
            };
            recognition.onerror = () => {
              fallbackVoiceFlow();
            };
            recognition.start();
          } catch (e) {
            fallbackVoiceFlow();
          }
        } else {
          fallbackVoiceFlow();
        }
      };

      const fallbackVoiceFlow = () => {
        setTimeout(() => {
          const sample = selectedLanguage === 'hi' ? "नमस्ते सावित्री जी, आपकी आज की दवाएँ और मस्तिष्क खेल तैयार हैं।" : "Namaste Savitri Ji, your daily wellness plan is active.";
          setVoiceText("आसरा, मेरा आज का दिन कैसा है?");
          setAiResponse(sample);
          setIsListening(false);
          speakResponse(sample);
        }, 1500);
      };

      const processVoiceCommand = (text) => {
        fetch("/api/ai/voice-intent", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text, lang: selectedLanguage, generate_audio: true })
        })
        .then(r => r.json())
        .then(data => {
          const reply = data.speech_response || "Namaste! Your routine is ready.";
          setAiResponse(reply);
          speakResponse(reply);
        })
        .catch(() => {
          const fallback = "नमस्ते! आपकी दवा और खेल तैयार हैं।";
          setAiResponse(fallback);
          speakResponse(fallback);
        });
      };

      const speakResponse = (text) => {
        // Try Sarvam TTS endpoint first
        fetch("/api/sarvam/tts", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text, lang: selectedLanguage, pace: 0.88 })
        })
        .then(r => r.json())
        .then(data => {
          if (data.audio_base64) {
            const audio = new Audio(`data:audio/wav;base64,${data.audio_base64}`);
            audio.play();
          } else if (window.speechSynthesis) {
            const u = new SpeechSynthesisUtterance(text);
            u.rate = 0.88;
            window.speechSynthesis.speak(u);
          }
        })
        .catch(() => {
          if (window.speechSynthesis) {
            const u = new SpeechSynthesisUtterance(text);
            u.rate = 0.88;
            window.speechSynthesis.speak(u);
          }
        });
      };

      // Launch Cognitive Game with Groq AI Dynamic Adaptation
      const launchGame = (game) => {
        setSelectedGame(game);
        setActiveModal("game_view");

        // Fetch dynamic difficulty from backend Groq Engine
        fetch("/api/cognitive/adaptive-difficulty", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            game_type: game.id,
            patient_name: currentUser.name,
            difficulty: 2.0,
            score: 85,
            completion_time_sec: 25
          })
        })
        .then(r => r.json())
        .then(data => {
          setGameDifficulty({
            level: data.next_recommended_level || 2.2,
            distractors: data.distractor_count || 4,
            clueDelay: data.clue_delay_sec || 15,
            engine: data.engine || "groq_lpu_ai",
            score: 88,
            note: data.adaptation_note
          });
        })
        .catch(() => {});
      };

      return (
        <div className="relative">
          {/* Main Realistic Phone Mockup Frame */}
          <div className="phone-frame flex flex-col">
            
            {/* Blurred Background Image */}
            <div className="phone-bg-image"></div>
            
            {/* Semi-Transparent #8a9aaa Overlay (30% opacity) */}
            <div className="phone-bg-overlay"></div>

            {/* Dynamic Island at Top Center */}
            <div 
              className={`dynamic-island ${islandExpanded ? 'expanded' : ''}`}
              onClick={() => setIslandExpanded(!islandExpanded)}
            >
              <div className="flex items-center space-x-2">
                <span className="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
                <span className="text-[11px] font-medium text-white/90 truncate">
                  {currentUser.name}
                </span>
              </div>
              <div className="flex items-center space-x-2">
                <span className="text-[10px] text-white/60 uppercase tracking-wider font-semibold">
                  {currentUser.role === 'patient' ? 'PIN 8492' : 'Caregiver'}
                </span>
                <div className="w-3.5 h-3.5 rounded-full bg-white/20 flex items-center justify-center">
                  <span className="text-[9px] text-white">⚡</span>
                </div>
              </div>
            </div>

            {/* Main Screen Content: Wellness Quiz View */}
            <div className="relative z-10 flex flex-col h-full pt-[56px] px-[24px] pb-[24px]">

              {/* 1. Header Badge */}
              <div className="mb-[40px] anim-fade-up" style={{ animationDelay: '0.1s' }}>
                <button 
                  onClick={() => setActiveModal("plan")}
                  className="liquid-glass inline-flex items-center space-x-2 py-[10px] px-[12px] rounded-full active:scale-95 transition-transform"
                >
                  <TimerIcon className="w-3.5 h-3.5 text-white/80" />
                  <span className="text-[12px] font-medium text-white/90 tracking-wide">
                    Vitaforge Daily
                  </span>
                </button>
              </div>

              {/* 2. Title Section */}
              <div className="mb-[32px] anim-fade-up" style={{ animationDelay: '0.25s' }}>
                <div className="text-white/60 text-[14px] mb-1 font-normal">
                  Choose all that apply
                </div>
                <h1 className="text-white text-[28px] font-normal leading-[1.15] tracking-tight">
                  What aspects of your wellness would you like to boost?
                </h1>
              </div>

              {/* 3. Selection Grid (2 columns, 12px gap, pushes to fill space) */}
              <div className="grid grid-cols-2 gap-[12px] flex-1">
                {wellnessOptions.map(opt => {
                  const isSelected = selectedCards.includes(opt.id);
                  return (
                    <div
                      key={opt.id}
                      onClick={() => toggleCard(opt.id)}
                      style={{ animationDelay: opt.delay }}
                      className={`anim-fade-up ${isSelected ? 'liquid-glass-selected' : 'liquid-glass'} rounded-[32px] h-[100px] p-[16px] flex flex-col justify-between cursor-pointer active:scale-95 transition-transform`}
                    >
                      <div className="text-white/50 text-[11px] font-medium tracking-wider">
                        {opt.number}
                      </div>
                      <div className="text-white text-[16px] font-medium tracking-tight">
                        {opt.label}
                      </div>
                    </div>
                  );
                })}
              </div>

              {/* 4. Voice Button (Centered with Radial Glow) */}
              <div className="my-[24px] flex flex-col items-center justify-center anim-fade-up" style={{ animationDelay: '0.7s' }}>
                <div className="relative w-[110px] h-[110px] flex items-center justify-center">
                  {/* Yellow/Gold Radial Glow */}
                  <div className="absolute inset-0 voice-radial-glow rounded-full pointer-events-none"></div>
                  
                  {/* 64px Circular Liquid Glass Button */}
                  <button
                    onClick={startVoiceSession}
                    className={`relative z-10 w-16 h-16 rounded-full liquid-glass flex items-center justify-center active:scale-90 transition-all ${isListening ? 'ring-4 ring-yellow-400/60 scale-105' : ''}`}
                    aria-label="Voice Activation"
                  >
                    {/* Waveform SVG Icon with 5 Vertical Bars of Varying Heights */}
                    <svg className="w-7 h-7" viewBox="0 0 28 28" fill="none" stroke="white" strokeWidth="2" strokeLinecap="round">
                      <line x1="4" y1="14" x2="4" y2="18" />
                      <line x1="9" y1="9" x2="9" y2="23" />
                      <line x1="14" y1="4" x2="14" y2="26" />
                      <line x1="19" y1="10" x2="19" y2="22" />
                      <line x1="24" y1="13" x2="24" y2="19" />
                    </svg>
                  </button>
                </div>
                <span className="text-white/70 text-[12px] -mt-2 font-medium tracking-wider">
                  {isListening ? 'Listening...' : 'voice'}
                </span>
              </div>

              {/* 5. Slide-to-Confirm Button */}
              <div className="w-full anim-fade-up" style={{ animationDelay: '0.85s' }}>
                <div 
                  ref={sliderTrackRef}
                  onPointerDown={handlePointerDown}
                  onPointerMove={handlePointerMove}
                  onPointerUp={handlePointerUp}
                  className="w-full h-[56px] rounded-full liquid-glass relative flex items-center px-1.5 overflow-hidden touch-none"
                >
                  {/* Centered Done Text */}
                  <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
                    <span className="text-white/60 text-[14px] font-medium tracking-wide">
                      Done
                    </span>
                  </div>

                  {/* 3 Chevron Icons on Right */}
                  <div className="absolute right-4 flex items-center space-x-1 pointer-events-none">
                    <ChevronRightIcon className="w-3.5 h-3.5 text-white/40" />
                    <ChevronRightIcon className="w-3.5 h-3.5 text-white/50 -ml-2" />
                    <ChevronRightIcon className="w-3.5 h-3.5 text-white/60 -ml-2" />
                  </div>

                  {/* Draggable Circular Thumb */}
                  <div 
                    style={{ 
                      transform: `translateX(${sliderProgress * 2.75}px)`,
                      transition: isDragging ? 'none' : 'transform 0.3s cubic-bezier(0.22, 1, 0.36, 1)'
                    }}
                    className="w-[44px] h-[44px] bg-white rounded-full flex items-center justify-center shadow-lg cursor-grab active:cursor-grabbing z-20"
                  >
                    <ArrowRightIcon className="w-4 h-4 text-gray-800" />
                  </div>
                </div>
              </div>

            </div>

            {/* Quick Navigation Floating Pills at Bottom Edge */}
            <div className="absolute bottom-2 left-1/2 -translate-x-1/2 z-30 flex items-center space-x-1.5 bg-black/40 backdrop-blur-md px-3 py-1.5 rounded-full border border-white/10">
              <button 
                onClick={() => setActiveModal("plan")} 
                className="text-[10px] font-medium text-white/80 hover:text-white px-2 py-0.5 rounded-full hover:bg-white/10"
              >
                Plan & Games
              </button>
              <span className="text-white/20">|</span>
              <button 
                onClick={() => setActiveModal("caregiver")} 
                className="text-[10px] font-medium text-white/80 hover:text-white px-2 py-0.5 rounded-full hover:bg-white/10"
              >
                Caregiver
              </button>
              <span className="text-white/20">|</span>
              <button 
                onClick={() => setActiveModal("auth")} 
                className="text-[10px] font-medium text-white/80 hover:text-white px-2 py-0.5 rounded-full hover:bg-white/10"
              >
                Profiles
              </button>
            </div>

            {/* --- Modals & Overlay Screens (Full AASRA Ecosystem) --- */}

            {/* 1. Wellness Plan & Mind Games Hub Modal */}
            {activeModal === "plan" && (
              <div className="absolute inset-0 z-40 bg-black/75 backdrop-blur-xl p-5 pt-12 flex flex-col text-white animate-fade-in overflow-y-auto">
                <div className="flex items-center justify-between mb-4">
                  <div>
                    <span className="text-[11px] uppercase tracking-wider text-yellow-300 font-semibold">Personalized Suite</span>
                    <h2 className="text-xl font-bold">Your Daily Care & Mind Hub</h2>
                  </div>
                  <button onClick={() => setActiveModal(null)} className="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center">
                    <XIcon className="w-4 h-4 text-white" />
                  </button>
                </div>

                {/* Selected Wellness Summary */}
                <div className="liquid-glass p-3.5 rounded-2xl mb-4 text-xs space-y-1.5">
                  <div className="font-semibold text-white/90">Active Boost Focus:</div>
                  <div className="flex flex-wrap gap-1.5">
                    {selectedCards.map(id => {
                      const item = wellnessOptions.find(o => o.id === id);
                      return (
                        <span key={id} className="bg-white/20 px-2 py-0.5 rounded-full text-[11px]">
                          {item?.icon} {item?.label}
                        </span>
                      );
                    })}
                  </div>
                </div>

                {/* 8 Cognitive Games Grid */}
                <div className="font-semibold text-sm mb-2 text-white/90">8 Cognitive Rehabilitation Games:</div>
                <div className="grid grid-cols-2 gap-2.5 flex-1">
                  {cognitiveGames.map(game => (
                    <div 
                      key={game.id}
                      onClick={() => launchGame(game)}
                      className="liquid-glass p-3 rounded-2xl flex flex-col justify-between cursor-pointer hover:bg-white/10 active:scale-95 transition-all text-left"
                    >
                      <div className="text-2xl mb-1">{game.icon}</div>
                      <div>
                        <div className="font-medium text-[13px] leading-tight text-white">{game.title}</div>
                        <div className="text-[10px] text-white/60 mt-0.5">{game.domain.split('&')[0]}</div>
                      </div>
                    </div>
                  ))}
                </div>

                {/* Quick Reminders & SOS */}
                <div className="mt-4 pt-3 border-t border-white/10 flex items-center justify-between">
                  <button 
                    onClick={() => {
                      fetch("/api/emergency/trigger", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ trigger_type: "Mobile App 1-Tap SOS" })
                      });
                      alert("🚨 Emergency SOS Triggered! Caregivers and Doctor notified with GPS coordinates.");
                    }}
                    className="bg-red-600 hover:bg-red-700 text-white text-xs font-bold px-4 py-2.5 rounded-full flex items-center space-x-1.5 active:scale-95 shadow-lg"
                  >
                    <AlertTriangleIcon className="w-3.5 h-3.5" />
                    <span>EMERGENCY SOS</span>
                  </button>

                  <button 
                    onClick={() => setActiveModal("caregiver")}
                    className="liquid-glass px-3.5 py-2.5 rounded-full text-xs font-medium text-white/90 active:scale-95"
                  >
                    Doctor Insights &rarr;
                  </button>
                </div>
              </div>
            )}

            {/* 2. Live Interactive Game View with Groq AI Difficulty */}
            {activeModal === "game_view" && selectedGame && (
              <div className="absolute inset-0 z-50 bg-[#16202c]/95 backdrop-blur-2xl p-5 pt-12 flex flex-col text-white animate-fade-in">
                <div className="flex items-center justify-between mb-3">
                  <div className="flex items-center space-x-2">
                    <span className="text-2xl">{selectedGame.icon}</span>
                    <div>
                      <h3 className="font-bold text-base leading-tight">{selectedGame.title}</h3>
                      <span className="text-[10px] text-emerald-400 font-medium">Groq LPU Dynamic Level: {gameDifficulty.level}</span>
                    </div>
                  </div>
                  <button onClick={() => setActiveModal("plan")} className="w-7 h-7 rounded-full bg-white/10 flex items-center justify-center">
                    <XIcon className="w-4 h-4 text-white" />
                  </button>
                </div>

                {/* Groq AI Difficulty HUD */}
                <div className="bg-white/5 border border-white/10 rounded-xl p-2.5 mb-4 text-[11px] space-y-1">
                  <div className="flex justify-between text-white/70">
                    <span>Target Attention Domain:</span>
                    <span className="font-semibold text-white">{selectedGame.domain}</span>
                  </div>
                  <div className="flex justify-between text-white/70">
                    <span>Distractor Count:</span>
                    <span className="text-yellow-300 font-semibold">{gameDifficulty.distractors} options</span>
                  </div>
                  <div className="text-[10px] text-white/50 italic">
                    AI Note: {gameDifficulty.note || "Pacing tuned gently to prevent cognitive fatigue."}
                  </div>
                </div>

                {/* Interactive Exercise Simulation Container */}
                <div className="flex-1 liquid-glass rounded-3xl p-4 flex flex-col items-center justify-center text-center space-y-4">
                  <div className="w-20 h-20 rounded-full bg-yellow-400/20 border border-yellow-400/40 flex items-center justify-center text-3xl animate-bounce">
                    {selectedGame.icon}
                  </div>
                  <div className="text-sm font-medium px-4 text-white/90">
                    "{currentUser.name} Ji, tap the item that feels most familiar and calming:"
                  </div>

                  <div className="grid grid-cols-2 gap-2.5 w-full">
                    {['Morning Tea ☕', 'Garden Tulsi 🌿', 'Grandchildren 👶', 'Temple Bell 🔔'].slice(0, gameDifficulty.distractors).map((choice, i) => (
                      <button
                        key={i}
                        onClick={() => {
                          alert(`✨ Excellent! Saved to Savitri Devi's cognitive record.`);
                          fetch("/api/cognitive/session", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                              game_id: selectedGame.id,
                              domain: "memory",
                              score: 95,
                              difficulty: gameDifficulty.level,
                              reaction_time_ms: 2400
                            })
                          });
                          setActiveModal("plan");
                        }}
                        className="py-3 px-2 rounded-2xl bg-white/10 hover:bg-white/20 border border-white/15 text-xs font-semibold text-white active:scale-95 transition-all"
                      >
                        {choice}
                      </button>
                    ))}
                  </div>
                </div>

                <div className="mt-3 flex justify-between items-center text-[11px] text-white/60">
                  <span>Audio hint ready</span>
                  <button onClick={() => speakResponse(`Tap the most familiar item Savitri Ji`)} className="text-yellow-300 font-medium">
                    🔊 Hear Hint
                  </button>
                </div>
              </div>
            )}

            {/* 3. Caregiver & Doctor Clinical Insights Modal */}
            {activeModal === "caregiver" && (
              <div className="absolute inset-0 z-40 bg-[#0f172a]/95 backdrop-blur-2xl p-5 pt-12 flex flex-col text-white animate-fade-in overflow-y-auto">
                <div className="flex items-center justify-between mb-4">
                  <div>
                    <span className="text-[11px] uppercase tracking-wider text-teal-400 font-semibold">Clinical Portal</span>
                    <h2 className="text-lg font-bold">Caregiver & Doctor Dashboard</h2>
                  </div>
                  <button onClick={() => setActiveModal(null)} className="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center">
                    <XIcon className="w-4 h-4 text-white" />
                  </button>
                </div>

                {/* Patient Overview Header */}
                <div className="liquid-glass p-3.5 rounded-2xl mb-3 space-y-2 text-xs">
                  <div className="flex justify-between items-center">
                    <span className="font-bold text-sm text-white">Savitri Devi (74y)</span>
                    <span className="bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded-full text-[10px]">Active Today</span>
                  </div>
                  <div className="text-white/70">Pairing Code: <span className="text-white font-mono font-bold">ASR-8492</span></div>
                  <div className="text-white/70">Medication Adherence: <span className="text-emerald-400 font-bold">92%</span></div>
                </div>

                {/* 6-Domain Cognitive Scores */}
                <div className="font-semibold text-xs mb-2 text-white/80">Cognitive Domains (Groq LPU Evaluated):</div>
                <div className="space-y-2 text-xs mb-4">
                  {[
                    { name: "Memory & Recall", score: 88, color: "bg-teal-400" },
                    { name: "Spatial Attention", score: 82, color: "bg-blue-400" },
                    { name: "Temporal Orientation", score: 79, color: "bg-amber-400" },
                    { name: "Language Fluency", score: 91, color: "bg-purple-400" }
                  ].map((dom, i) => (
                    <div key={i} className="liquid-glass p-2.5 rounded-xl">
                      <div className="flex justify-between mb-1 text-[11px]">
                        <span>{dom.name}</span>
                        <span className="font-bold">{dom.score}%</span>
                      </div>
                      <div className="w-full bg-white/10 h-1.5 rounded-full overflow-hidden">
                        <div className={`${dom.color} h-full rounded-full`} style={{ width: `${dom.score}%` }}></div>
                      </div>
                    </div>
                  ))}
                </div>

                {/* Doctor Note */}
                <div className="bg-white/5 border border-white/10 p-3 rounded-2xl text-xs space-y-1">
                  <div className="font-bold text-yellow-300">Dr. Sunita Barua's Observation:</div>
                  <div className="text-white/70 leading-relaxed">
                    "Consistent engagement in family photo recall. Visual distractors should remain at level 4 to avoid stress."
                  </div>
                </div>
              </div>
            )}

            {/* 4. Multi-Role Profiles & Quick Auth Modal */}
            {activeModal === "auth" && (
              <div className="absolute inset-0 z-40 bg-black/85 backdrop-blur-2xl p-5 pt-12 flex flex-col text-white animate-fade-in">
                <div className="flex items-center justify-between mb-4">
                  <div>
                    <span className="text-[11px] uppercase tracking-wider text-yellow-400 font-semibold">Access Control</span>
                    <h2 className="text-lg font-bold">Switch Profile & Sign In</h2>
                  </div>
                  <button onClick={() => setActiveModal(null)} className="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center">
                    <XIcon className="w-4 h-4 text-white" />
                  </button>
                </div>

                <div className="space-y-2.5 flex-1">
                  {[
                    { name: "Savitri Devi", role: "patient", badge: "Senior Patient", pin: "PIN 8492" },
                    { name: "Rahul Sharma", role: "caregiver", badge: "Primary Caregiver", pin: "Code ASR-8492" },
                    { name: "Dr. Sunita Barua", role: "doctor", badge: "Attending Neurologist", pin: "Pass Doctor@123" }
                  ].map((prof, i) => (
                    <div
                      key={i}
                      onClick={() => {
                        setCurrentUser({ name: prof.name, role: prof.role });
                        setActiveModal(null);
                      }}
                      className={`p-3.5 rounded-2xl liquid-glass flex items-center justify-between cursor-pointer hover:bg-white/15 active:scale-95 transition-all ${currentUser.name === prof.name ? 'liquid-glass-selected' : ''}`}
                    >
                      <div className="flex items-center space-x-3">
                        <div className="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center font-bold text-sm">
                          {prof.name.split(' ').map(n => n[0]).join('')}
                        </div>
                        <div>
                          <div className="font-semibold text-sm">{prof.name}</div>
                          <div className="text-[11px] text-white/60">{prof.badge}</div>
                        </div>
                      </div>
                      <span className="text-[10px] bg-white/15 px-2 py-1 rounded-full font-mono">
                        {prof.pin}
                      </span>
                    </div>
                  ))}
                </div>

                <div className="mt-4 pt-3 border-t border-white/10 text-center">
                  <span className="text-[11px] text-white/50">Protected with PBKDF2 HMAC-SHA256 & SQLite</span>
                </div>
              </div>
            )}

          </div>
        </div>
      );
    }

    // Render React Application to Root
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
